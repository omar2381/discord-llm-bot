services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_started
        required: false
    restart: unless-stopped

  # Only started with --profile ai, so the bot runs on its own by default.
  ollama:
    image: ollama/ollama
    profiles: ['ai']
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama: {}
